name: Deploy Stage to Vercel

# Fires ONLY on push to `stage`. Deploys all three Vercel-hosted frontends —
# admin, vendor, and customer — to their stage targets. Never touches
# production; see deploy-vercel-prod.yml for that (main-only, admin+vendor).
#
# Deploys via the Vercel CLI authenticated with an account-wide VERCEL_TOKEN,
# not Vercel's own git-push auto-deploy — the Vercel projects live under a
# different account than the GitHub account pushing commits, and Vercel
# blocks git-push-triggered deploys (and even inspects git-commit metadata on
# CLI deploys) from any non-owning account on a private repo, Hobby plan.
# Stripping .git before any vercel command removes that metadata entirely so
# there's nothing for it to reject.
#
# Required GitHub Secrets:
#   VERCEL_TOKEN                 Account-wide token (Vercel → Account Settings → Tokens)
#   VERCEL_ORG_ID                 Team ID (or personal "Your ID") that owns the projects
#   VERCEL_PROJECT_ID_ADMIN        Admin project's Project ID
#   VERCEL_PROJECT_ID_VENDOR       Vendor project's Project ID
#   VERCEL_PROJECT_ID_CUSTOMER     Customer project's Project ID
#
# Note: customer's OWN Vercel project has its Production Branch set to
# `stage` (see DEPLOY.md) — prod customer traffic is served from Hostinger,
# not this project — so its stage push is a PRODUCTION deploy for that
# project specifically. That's what puts it on stagecustomer.autosahay.com.

on:
  push:
    branches: [stage]

jobs:
  deploy-admin:
    name: Admin (stage)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
    steps:
      - uses: actions/checkout@v4

      - name: Strip git metadata
        run: rm -rf .git

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy (tagged as stage branch, for the stageadmin domain alias)
        env:
          VERCEL_GIT_COMMIT_REF: stage
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-vendor:
    name: Vendor (stage)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_VENDOR }}
    steps:
      - uses: actions/checkout@v4

      - name: Strip git metadata
        run: rm -rf .git

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (preview)
        run: vercel pull --yes --environment=preview --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --token="$VERCEL_TOKEN"

      - name: Deploy (tagged as stage branch, for the stagevendor domain alias)
        env:
          VERCEL_GIT_COMMIT_REF: stage
          VERCEL_GIT_COMMIT_SHA: ${{ github.sha }}
        run: vercel deploy --prebuilt --token="$VERCEL_TOKEN"

  deploy-customer:
    name: Customer (stage — this IS its production branch)
    runs-on: ubuntu-latest
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CUSTOMER }}
    steps:
      - uses: actions/checkout@v4

      - name: Strip git metadata
        run: rm -rf .git

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel project settings (production)
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Build
        run: vercel build --prod --token="$VERCEL_TOKEN"

      - name: Deploy
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
